<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#0ea5e9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-node{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.25);opacity:1;filter:drop-shadow(0 0 8px #38bdf8)}}@keyframes shield-glow{0%{opacity:.7}50%{opacity:1;filter:drop-shadow(0 0 15px #818cf8)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:url(#text-grad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#f8fafc}.pulse-1{animation:pulse-node 3s infinite ease-in-out;transform-origin:150px 100px}.pulse-2{animation:pulse-node 3.5s infinite ease-in-out .5s;transform-origin:1050px 120px}.pulse-3{animation:pulse-node 4s infinite ease-in-out 1s;transform-origin:1000px 240px}.pulse-4{animation:pulse-node 3.2s infinite ease-in-out 1.5s;transform-origin:180px 230px}.flow-line{stroke:#475569;stroke-width:2;stroke-dasharray:6,6;animation:dash-flow 2s linear infinite}.shield-icon{animation:shield-glow 4s infinite ease-in-out}</style><rect width="1200" height="320" fill="url(#bg-grad)" rx="16"/><g opacity=".1"><path stroke="#94a3b8" stroke-width="1" d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200"/><path stroke="#94a3b8" stroke-width="1" d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320"/></g><g><path fill="none" d="M 150 100 L 250 160 L 180 230" class="flow-line"/><path fill="none" d="M 1050 120 L 950 180 L 1000 240" class="flow-line"/><circle cx="150" cy="100" r="8" fill="#38bdf8" class="pulse-1"/><circle cx="250" cy="160" r="5" fill="#818cf8"/><circle cx="180" cy="230" r="7" fill="#c084fc" class="pulse-4"/><circle cx="1050" cy="120" r="8" fill="#38bdf8" class="pulse-2"/><circle cx="950" cy="180" r="5" fill="#818cf8"/><circle cx="1000" cy="240" r="7" fill="#34d399" class="pulse-3"/></g><g class="shield-icon"><path fill="none" stroke="url(#accent-grad)" stroke-width="3" d="M 0 -40 L 40 -20 V 20 C 0 50 -40 50 -40 20 V -20 Z" opacity=".3" transform="translate(600, 75) scale(0.8) translate(0, 40) scale(2.2)"/></g><g text-anchor="middle"><rect width="320" height="32" x="440" y="40" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="600" y="61" class="badge-text" text-anchor="middle">🔐 ENTERPRISE PKI &amp; CLM ECOSYSTEM</text><text x="600" y="130" class="title" filter="url(#glow)">Awesome Certificate Lifecycle Management</text><text x="600" y="175" class="subtitle">Curated SaaS Platforms, Automated PKI, ACME Clients &amp; Open-Source Tools</text><g transform="translate(300, 220)"><rect width="130" height="30" x="0" y="0" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="8"/><text x="65" y="20" fill="#38bdf8" class="badge-text" text-anchor="middle">⚡ Discovery</text><rect width="140" height="30" x="150" y="0" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" rx="8"/><text x="220" y="20" fill="#818cf8" class="badge-text" text-anchor="middle">🔑 Auto-Renewal</text><rect width="140" height="30" x="310" y="0" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" rx=